# DVICode Lint as a GitHub Action: downloads a pinned DVICode release (checksum verified), lints
# the project, annotates the pull request, and uploads SARIF to code scanning.
#
# This folder is the content of the separate repository hexkDotCom/dvicode-lint-action (the
# Marketplace lists one action per repository).
name: DVICode Lint
description: Lint SystemVerilog and UVM code with DVICode (recommended rules, or the HEXK SV/UVM Style Guide)
author: HEXK
branding:
  icon: check-circle
  color: blue
inputs:
  version:
    description: 'The DVICode release to use (a version such as 0.8.0)'
    required: false
    default: '0.8.0'
  path:
    description: 'The project folder'
    required: false
    default: '.'
  args:
    description: 'More arguments for `dvicode lint` (--rulesets hexk, --build FILE, --baseline FILE, --changed-since origin/main...): split as a shell splits words, with quotes ("a b") kept together; no variables or wildcards'
    required: false
    default: ''
  fail-on:
    description: 'The lowest level that fails the step (error, warning, info, never)'
    required: false
    default: warning
  sarif:
    description: 'Upload SARIF to GitHub code scanning (needs `security-events: write`)'
    required: false
    default: 'true'
outputs:
  exit-code:
    description: 'The exit status of dvicode lint'
    value: ${{ steps.lint.outputs.code }}
runs:
  using: composite
  steps:
    - name: Install dvicode ${{ inputs.version }}
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux-x64; ext=tar.gz ;;
          Linux/ARM64) platform=linux-arm64; ext=tar.gz ;;
          macOS/ARM64) platform=darwin-arm64; ext=tar.gz ;;
          macOS/X64) platform=darwin-x64; ext=tar.gz ;;
          Windows/X64) platform=win32-x64; ext=zip ;;
          *) echo "::error::DVICode has no build for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        name="dvicode-$VERSION-$platform"
        base="https://github.com/hexkDotCom/dvicode/releases/download/v$VERSION"
        # A folder of its own: the action may run more than once in a job.
        dir=$(mktemp -d "$RUNNER_TEMP/dvicode.XXXXXX")
        cd "$dir"
        curl -fsSL -o "$name.$ext" "$base/$name.$ext"
        curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
        # macOS has shasum, not sha256sum.
        if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
        grep " $name.$ext\$" SHA256SUMS | $sum -c -
        if [ "$ext" = zip ]; then unzip -q "$name.$ext"; else tar -xzf "$name.$ext"; fi
        echo "$dir/$name" >> "$GITHUB_PATH"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
    - name: Lint
      id: lint
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
        LINT_ARGS: ${{ inputs.args }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF: ${{ steps.install.outputs.dir }}/dvicode-lint.sarif
      run: |
        # The arguments as words: xargs splits them and honours quotes, without expanding
        # anything (no eval). Bash 3 too (macOS).
        args=()
        if [ -n "${LINT_ARGS//[[:space:]]/}" ]; then
          if ! printf '%s' "$LINT_ARGS" | xargs printf '%.0s' > /dev/null; then
            echo "::error::cannot split the args input (unbalanced quotes?)"
            echo "code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r -d '' a; do args+=("$a"); done < <(printf '%s' "$LINT_ARGS" | xargs printf '%s\0')
        fi
        dvicode lint "$LINT_PATH" --format github --output-sarif "$SARIF" --fail-on "$FAIL_ON" ${args[@]+"${args[@]}"}
        echo "code=$?" >> "$GITHUB_OUTPUT"
        # hashFiles() sees only the workspace: say here whether there is a report.
        if [ -f "$SARIF" ]; then echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"; fi
    - name: Upload SARIF
      if: always() && inputs.sarif == 'true' && steps.lint.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
      with:
        sarif_file: ${{ steps.lint.outputs.sarif }}
        category: dvicode-lint
    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.lint.outputs.code }}
      run: |
        case "$CODE" in
          0) ;;
          1) echo "::error::DVICode Lint found problems at or above the fail-on level"; exit 1 ;;
          2) echo "::error::DVICode Lint: usage or configuration error (see the log)"; exit 2 ;;
          4) echo "::error::DVICode Lint could not analyse everything (encrypted code, syntax errors): add --allow-incomplete to accept that"; exit 4 ;;
          *) echo "::error::DVICode Lint failed (exit $CODE)"; exit "$CODE" ;;
        esac
