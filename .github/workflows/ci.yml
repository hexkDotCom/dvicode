# Checks every push to main and every pull request (and runs by hand).
#
# - server:   `cargo test` for the Rust crates on Linux, Windows and macOS; on Linux also
#             `dvicode-server check` on the demo project (clean, and with its deliberate errors).
# - client:   type check, unit tests (`npm run unit`: path mapping, remote file system, views) and
#             the bundle, on Linux and Windows.
# - e2e:      the end-to-end suite (client/test/suite.js) in a downloaded VS Code against
#             examples/demo-project, with an engine built in the job:
#               linux-local    engine on the runner, VS Code under xvfb;
#               linux-ssh      engine over SSH to localhost (sshd started on the runner, a fresh
#                              key); the extension deploys the engine itself;
#               windows-local  the native Windows engine (the runners have no WSL);
#               macos-local    the native macOS engine on Apple silicon;
#               linux-vscode-1.85  as linux-local, in VS Code 1.85, the oldest version
#                              client/package.json accepts.
#             A run in which VS Code reports no result at all (exit code 3, seen now and then
#             on a first start) is retried once, with a warning.
# - coverage: line coverage of the Rust crates (cargo-llvm-cov): a per-crate table in the job
#             summary, and lcov plus HTML as the `rust-coverage` artifact. No threshold yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch (a runner image change, say).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Test
        working-directory: server
        run: cargo test --locked
      - name: Demo project compiles cleanly
        if: runner.os == 'Linux'
        working-directory: server
        run: cargo run --release --locked -p dvicode-server -- check ../examples/demo-project -q
      - name: Deliberate mistakes are reported
        if: runner.os == 'Linux'
        working-directory: server
        run: |
          set +e
          cargo run --release --locked -p dvicode-server -- check ../examples/demo-project \
            --build ../examples/demo-project/.dvicode/errors.build -q 2> errors.txt
          status=$?
          cat errors.txt
          test "$status" -eq 1
      - name: Lint the demo project, and its SARIF
        if: runner.os == 'Linux'
        working-directory: server
        run: |
          cargo run --release --locked -p dvicode-server -- lint ../examples/demo-project --output-sarif lint.sarif
          python3 -c "import json; r = json.load(open('lint.sarif'))['runs'][0]; assert r['tool']['driver']['rules'] and 'results' in r"
          # The rule pages and the schema the extension ships are the rules' own.
          cargo run --release --locked -p dvicode-server -- lint --docs /tmp/lint-docs
          diff -r /tmp/lint-docs ../docs/lint

  client:
    name: Extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run unit
      - name: Bundle
        run: node esbuild.mjs --production

  e2e:
    name: End-to-end (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-local, os: ubuntu-latest, platform: linux-x64, exe: dvicode-server, target: this machine }
          - { name: linux-ssh, os: ubuntu-latest, platform: linux-x64, exe: dvicode-server, target: ssh localhost, ssh: true }
          - { name: windows-local, os: windows-latest, platform: win32-x64, exe: dvicode-server.exe, target: this machine }
          - { name: macos-local, os: macos-latest, platform: darwin-arm64, exe: dvicode-server, target: this machine }
          # The oldest VS Code client/package.json accepts (engines.vscode).
          - { name: linux-vscode-1.85, os: ubuntu-latest, platform: linux-x64, exe: dvicode-server, target: this machine, vscode: 1.85.0 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: ${{ matrix.name }}
      - name: Build the engine
        working-directory: server
        run: cargo build --release --locked -p dvicode-server
      - name: Put the engine where the extension looks for it
        run: |
          mkdir -p client/server/${{ matrix.platform }}
          cp server/target/release/${{ matrix.exe }} client/server/${{ matrix.platform }}/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the extension
        working-directory: client
        run: |
          npm ci
          node esbuild.mjs
      - name: Prepare the display
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -q; sudo apt-get install -y -q xvfb; }
          # Ubuntu 24.04 keeps Electron's sandbox from starting without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Start sshd with a key for localhost
        if: matrix.ssh
        run: |
          set -euo pipefail
          test -x /usr/sbin/sshd || { sudo apt-get update -q; sudo apt-get install -y -q openssh-server; }
          sudo systemctl start ssh || sudo service ssh start
          chmod go-w "$HOME"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_dvicode
          cat ~/.ssh/id_dvicode.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_dvicode -o BatchMode=yes localhost 'echo "ssh to $(hostname): $(uname -sm)"'
          printf 'DVICODE_E2E_SETTINGS={"dvicode.server.mode":"ssh","dvicode.server.sshHost":"localhost","dvicode.server.sshArgs":["-i","%s/.ssh/id_dvicode"]}\n' "$HOME" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite
        working-directory: client
        env:
          # Empty: current stable.
          DVICODE_E2E_VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          run() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node test/runTest.js "$GITHUB_WORKSPACE/examples/demo-project" ${{ matrix.name }}
            else
              node test/runTest.js "$GITHUB_WORKSPACE/examples/demo-project" ${{ matrix.name }}
            fi
          }
          set +e
          run 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 3 ]; then
            echo "::warning::VS Code reported no result; running the end-to-end suite again"
            run 2>&1 | tee e2e.log
            status=${PIPESTATUS[0]}
          fi
          test "$status" -eq 0 || exit "$status"
          # The engine ran where this job meant it to.
          grep -q "server: ${{ matrix.target }}$" e2e.log || { echo "the engine did not run on '${{ matrix.target }}'"; exit 1; }
      - name: The extension deployed the engine over SSH
        if: matrix.ssh
        run: ls -l ~/.dvicode/server/*/dvicode-server

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: coverage
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Measure
        working-directory: server
        # cargo-llvm-cov leaves test files (tests/, tests.rs) out of the figures.
        run: |
          cargo llvm-cov --locked --workspace --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --json --summary-only | python3 ../scripts/coverage_summary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: |
            server/lcov.info
            server/coverage/html
          if-no-files-found: error
