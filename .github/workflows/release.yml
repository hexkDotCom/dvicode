# Builds the engine for each platform and packages one VS Code extension per platform.
#
# - Push a tag `v<version>` (matching client/package.json) to build the packages, attach them
#   to a GitHub release and attest their provenance (which workflow run built them, from which
#   commit).
# - Run the workflow by hand from main to build the packages as artifacts, to try them first.
# - Run it by hand from main with `tag` set (`v0.3.2`) to publish that release's packages to
#   Open VSX through trusted publishing (no stored token; see docs/releasing.md): the very
#   packages the tag built, checked against their attestations, not a new build. The VS Code
#   Marketplace is updated by uploading the same packages by hand.
#
# Every package contains the engine for its own platform (local use) and the static Linux
# x64 engine (deployed to WSL and SSH hosts).
#
# The same engines are also released as the `dvicode` command (DVICode Lint and check, for CI
# and other editors): an archive per platform with SHA256SUMS, and Python wheels
# (`pip install dvicode`), attested like the packages. Run the workflow by hand with
# `pypi_tag` to publish a release's wheels to PyPI (trusted publishing), and with
# `container_tag` to push its Linux engine as ghcr.io/hexkdotcom/dvicode.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Publish the packages of this release to Open VSX (a tag such as v0.3.2; empty to build packages only)
        type: string
        default: ''
      pypi_tag:
        description: Publish the Python wheels of this release to PyPI (a tag such as v0.8.0)
        type: string
        default: ''
      container_tag:
        description: Push the container image of this release to ghcr.io (a tag such as v0.8.0)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  engine:
    name: Engine ${{ matrix.platform }}
    if: inputs.tag == '' && inputs.pypi_tag == '' && inputs.container_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # `emulator` runs the smoke test of an engine built for another CPU than the runner's:
          # qemu for Linux ARM (cross-compiled on x64), Rosetta 2 for macOS x64 (on Apple silicon).
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: dvicode-server }
          - { platform: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, exe: dvicode-server, emulator: qemu-aarch64 }
          - { platform: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: dvicode-server.exe }
          - { platform: darwin-arm64, os: macos-15, target: aarch64-apple-darwin, exe: dvicode-server }
          - { platform: darwin-x64, os: macos-15, target: x86_64-apple-darwin, exe: dvicode-server, emulator: arch -x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: C compiler for musl
        # mimalloc, the allocator of the x86_64 Linux engine, is C: it needs musl's headers.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        shell: bash
        working-directory: server
        env:
          # Static C runtime on Windows (no Visual C++ redistributable needed); Rust's own
          # linker for the cross-compiled Linux ARM build.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Emulator for the smoke test
        if: matrix.emulator
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q qemu-user
          else
            arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Smoke test
        shell: bash
        run: |
          bin=server/target/${{ matrix.target }}/release/${{ matrix.exe }}
          file "$bin" || true
          ${{ matrix.emulator }} "$bin" check examples/demo-project -q 2> smoke.txt
          cat smoke.txt
          # Build-file warnings (unresolved paths) count as failures too.
          ! grep -q "build config:" smoke.txt
      - name: Tests
        # Packaging needs every engine job, so a failing test stops the release. On the musl
        # target: with the allocator the engine ships with.
        if: matrix.platform == 'linux-x64'
        working-directory: server
        run: cargo test --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.platform }}
          path: server/target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  package:
    name: Packages
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache: what goes into a release comes from the lock file alone.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*
          path: engines
      - name: Check the versions match
        run: |
          version=$(node -p "require('./client/package.json').version")
          engine=$(cargo metadata --locked --no-deps --format-version 1 --manifest-path server/Cargo.toml \
            | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'dvicode-server').version")
          test "$engine" = "$version" || { echo "engine $engine != extension $version"; exit 1; }
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi
      - name: Build the extension
        working-directory: client
        run: |
          npm ci
          node esbuild.mjs --production
      - name: Package one extension per platform, and one for all platforms
        run: |
          set -euo pipefail
          version=$(node -p "require('./client/package.json').version")
          mkdir -p dist
          cp LICENSE NOTICE client/
          declare -A rust_target=(
            [linux-x64]=x86_64-unknown-linux-musl [linux-arm64]=aarch64-unknown-linux-musl
            [win32-x64]=x86_64-pc-windows-msvc [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
          )
          # The universal package (no --target) carries every engine, so one file works
          # everywhere; the stores prefer the smaller platform package when there is one.
          for platform in linux-x64 linux-arm64 win32-x64 darwin-arm64 darwin-x64 universal; do
            rm -rf client/server
            # Every package has the Linux x64 engine, which is deployed to WSL and SSH hosts.
            if [ "$platform" = universal ]; then
              engines="${!rust_target[*]}"
            elif [ "$platform" = linux-x64 ]; then
              engines=linux-x64
            else
              engines="linux-x64 $platform"
            fi
            targets=""
            for e in $engines; do
              mkdir -p "client/server/$e"
              install -m 755 engines/engine-$e/* "client/server/$e/"
              targets="$targets${targets:+,}${rust_target[$e]}"
            done
            python3 scripts/third_party_notices.py --targets "$targets" \
              --out client/THIRD_PARTY_NOTICES.md --rust-std-copy client/licenses/rust-std-library.html
            if [ "$platform" = universal ]; then
              (cd client && npx vsce package --no-dependencies -o "../dist/dvicode-$version.vsix")
            else
              (cd client && npx vsce package --no-dependencies --target "$platform" -o "../dist/dvicode-$platform-$version.vsix")
            fi
          done
          ls -l dist
      - name: The dvicode command, an archive per platform, and Python wheels
        run: |
          set -euo pipefail
          version=$(node -p "require('./client/package.json').version")
          mkdir -p cli wheels
          declare -A rust_target=(
            [linux-x64]=x86_64-unknown-linux-musl [linux-arm64]=aarch64-unknown-linux-musl
            [win32-x64]=x86_64-pc-windows-msvc [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
          )
          for platform in linux-x64 linux-arm64 win32-x64 darwin-arm64 darwin-x64; do
            d="cli/dvicode-$version-$platform"
            mkdir -p "$d"
            if [ "$platform" = win32-x64 ]; then exe=dvicode.exe; else exe=dvicode; fi
            install -m 755 engines/engine-$platform/* "$d/$exe"
            cp LICENSE NOTICE "$d/"
            cp docs/lint-cli-readme.md "$d/README.md"
            # The notices of this platform's engine, with the Rust notices in licenses/; the
            # wheel of the platform carries the same files.
            python3 scripts/third_party_notices.py --cli --targets "${rust_target[$platform]}" --out "$d/THIRD_PARTY_NOTICES.md"
            mkdir -p "notices/$platform"
            cp -r "$d/THIRD_PARTY_NOTICES.md" "$d/licenses" "notices/$platform/"
            if [ "$platform" = win32-x64 ]; then
              (cd cli && zip -qr "dvicode-$version-$platform.zip" "dvicode-$version-$platform")
            else
              tar -C cli -czf "cli/dvicode-$version-$platform.tar.gz" "dvicode-$version-$platform"
            fi
            rm -rf "$d"
          done
          (cd cli && sha256sum dvicode-* > SHA256SUMS)
          python3 scripts/pypi/build_wheels.py --engines engines --version "$version" --out wheels --readme docs/lint-cli-readme.md --notices notices
          ls -l cli wheels
          # The Linux wheel runs here: the command answers.
          python3 -m venv /tmp/w && /tmp/w/bin/pip install -q wheels/*manylinux*x86_64*.whl && /tmp/w/bin/dvicode lint --list-rules > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: |
            cli/*
            wheels/*.whl
          if-no-files-found: error

  release:
    # Only for the tag push, in a job of its own: the building jobs never hold the rights to
    # sign or to write releases.
    name: GitHub release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist
      - name: Provenance
        # The packages say which workflow built them, from which tag; publishing to Open VSX
        # and PyPI checks that before it publishes them.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.vsix
            dist/cli/dvicode-*
            dist/wheels/*.whl
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix dist/cli/* dist/wheels/*.whl -R "$GITHUB_REPOSITORY" --title "DVICode $GITHUB_REF_NAME" --generate-notes --prerelease

  open-vsx:
    name: Publish to Open VSX
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    # Trusted publishing: Open VSX is registered to trust this workflow file, in this repository,
    # in this environment, and exchanges the job's OIDC ID token for a token that can publish this
    # one extension for a few minutes. No access token is stored.
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      # Only the publishing tool's locked dependency list.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ovsx
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install ovsx
        # Exactly the versions and hashes of scripts/ovsx/package-lock.json, with no install
        # scripts: nothing else runs in this job, which can publish.
        run: npm ci --ignore-scripts --prefix scripts/ovsx
      - name: The release's packages, as the tag's run built them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.vsix' -D dist
          version=${TAG#v}
          ls -l dist
          # Exactly the six packages of that version.
          expected=$(printf '%s\n' "dvicode-$version.vsix" dvicode-{linux-x64,linux-arm64,win32-x64,darwin-arm64,darwin-x64}-"$version".vsix | sort)
          test "$(ls dist | sort)" = "$expected" || { echo "expected:"; echo "$expected"; exit 1; }
          for f in dist/*.vsix; do
            name=$(basename "$f")
            digest=$(sha256sum "$f" | cut -d' ' -f1)
            # Built by this workflow, in this repository, from the tag, under this very name
            # (an attested package copied under another platform's name would not be).
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --deny-self-hosted-runners --format json \
              | jq -e --arg n "$name" --arg d "$digest" \
                  'any(.[].verificationResult.statement.subject[]; .name == $n and .digest.sha256 == $d)' >/dev/null \
              || { echo "no attestation of $name with digest $digest"; exit 1; }
          done
      - name: Publish
        run: |
          set -euo pipefail
          for f in dist/*.vsix; do
            scripts/ovsx/node_modules/.bin/ovsx publish "$f" --trusted-publishing --skip-duplicate
          done

  pypi:
    name: Publish the wheels to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.pypi_tag != ''
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI is registered to trust this workflow file in this environment and
    # exchanges the job's OIDC ID token for a short-lived upload token. No token is stored.
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: The release's wheels, as the tag's run built them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.pypi_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.whl' -D wheels
          version=${TAG#v}
          ls -l wheels
          # Exactly the five wheels of that version (scripts/pypi/build_wheels.py names them).
          expected=$(printf "dvicode-$version-py3-none-%s.whl\n" \
            manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64 \
            manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64 \
            win_amd64 macosx_11_0_arm64 macosx_10_12_x86_64 | sort)
          test "$(ls wheels | sort)" = "$expected" || { echo "expected:"; echo "$expected"; exit 1; }
          for f in wheels/*.whl; do
            name=$(basename "$f")
            digest=$(sha256sum "$f" | cut -d' ' -f1)
            # Attested under this very name: the name decides which platforms pip installs it on.
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --deny-self-hosted-runners --format json \
              | jq -e --arg n "$name" --arg d "$digest" \
                  'any(.[].verificationResult.statement.subject[]; .name == $n and .digest.sha256 == $d)' >/dev/null \
              || { echo "no attestation of $name with digest $digest"; exit 1; }
          done
      - name: Publish
        run: |
          set -euo pipefail
          # The OIDC token for PyPI, exchanged for an upload token (PyPI's trusted publishing).
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r .value)
          token=$(curl -sSf -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\": \"$oidc\"}" | jq -r .token)
          python3 -m pip install -q twine==6.1.0
          # --skip-existing: a run that stopped part way can be run again (PyPI never takes
          # other content under a file name it has).
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$token" python3 -m twine upload --non-interactive --skip-existing wheels/*.whl

  container:
    name: Push the container image
    if: github.event_name == 'workflow_dispatch' && inputs.container_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/docker
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.container_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          version=${TAG#v}
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "dvicode-$version-linux-x64.tar.gz" -D .
          gh attestation verify "dvicode-$version-linux-x64.tar.gz" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" > /dev/null
          tar -xzf "dvicode-$version-linux-x64.tar.gz"
          cp -r "dvicode-$version-linux-x64/dvicode" "dvicode-$version-linux-x64"/{LICENSE,NOTICE,THIRD_PARTY_NOTICES.md,licenses} packaging/docker/
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr A-Z a-z)/dvicode
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$version" -t "$image:latest" packaging/docker
          docker run --rm "$image:$version" lint --list-rules > /dev/null
          docker push "$image:$version"
          docker push "$image:latest"
          # A new package on ghcr.io is private: the first time, make it public in the package
          # settings (docs/releasing.md); until then pulling it anonymously fails.
          docker logout ghcr.io
          docker pull -q "$image:$version" > /dev/null \
            || echo "::warning::$image is not public yet: change its visibility in the package settings"
