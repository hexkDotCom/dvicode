# Builds the engine for each platform and packages one VS Code extension per platform.
#
# - Push a tag `v<version>` (matching client/package.json) to build and attach the packages
#   to a GitHub release.
# - Run the workflow by hand to build the packages as artifacts; tick "publish" to also
#   publish them to Open VSX through trusted publishing (no stored token; see
#   docs/releasing.md). The VS Code Marketplace is updated by uploading the packages by hand.
#
# Every package contains the engine for its own platform (local use) and the static Linux
# x64 engine (deployed to WSL and SSH hosts).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Open VSX
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engine:
    name: Engine ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `emulator` runs the smoke test of an engine built for another CPU than the runner's:
          # qemu for Linux ARM (cross-compiled on x64), Rosetta 2 for macOS x64 (on Apple silicon).
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: dvicode-server }
          - { platform: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, exe: dvicode-server, emulator: qemu-aarch64 }
          - { platform: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: dvicode-server.exe }
          - { platform: darwin-arm64, os: macos-14, target: aarch64-apple-darwin, exe: dvicode-server }
          - { platform: darwin-x64, os: macos-14, target: x86_64-apple-darwin, exe: dvicode-server, emulator: arch -x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: C compiler for musl
        # mimalloc, the allocator of the x86_64 Linux engine, is C: it needs musl's headers.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        shell: bash
        working-directory: server
        env:
          # Static C runtime on Windows (no Visual C++ redistributable needed); Rust's own
          # linker for the cross-compiled Linux ARM build.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Emulator for the smoke test
        if: matrix.emulator
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q qemu-user
          else
            arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Smoke test
        shell: bash
        run: |
          bin=server/target/${{ matrix.target }}/release/${{ matrix.exe }}
          file "$bin" || true
          ${{ matrix.emulator }} "$bin" check examples/demo-project -q 2> smoke.txt
          cat smoke.txt
          # Build-file warnings (unresolved paths) count as failures too.
          ! grep -q "build config:" smoke.txt
      - name: Tests
        # Packaging needs every engine job, so a failing test stops the release. On the musl
        # target: with the allocator the engine ships with.
        if: matrix.platform == 'linux-x64'
        working-directory: server
        run: cargo test --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-${{ matrix.platform }}
          path: server/target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  package:
    name: Packages
    needs: engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: engine-*
          path: engines
      - name: Check the versions match
        run: |
          version=$(node -p "require('./client/package.json').version")
          engine=$(cargo metadata --locked --no-deps --format-version 1 --manifest-path server/Cargo.toml \
            | node -p "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'dvicode-server').version")
          test "$engine" = "$version" || { echo "engine $engine != extension $version"; exit 1; }
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi
      - name: Build the extension
        working-directory: client
        run: |
          npm ci
          node esbuild.mjs --production
      - name: Package one extension per platform, and one for all platforms
        run: |
          set -euo pipefail
          version=$(node -p "require('./client/package.json').version")
          mkdir -p dist
          cp LICENSE NOTICE client/
          declare -A rust_target=(
            [linux-x64]=x86_64-unknown-linux-musl [linux-arm64]=aarch64-unknown-linux-musl
            [win32-x64]=x86_64-pc-windows-msvc [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
          )
          # The universal package (no --target) carries every engine, so one file works
          # everywhere; the stores prefer the smaller platform package when there is one.
          for platform in linux-x64 linux-arm64 win32-x64 darwin-arm64 darwin-x64 universal; do
            rm -rf client/server
            # Every package has the Linux x64 engine, which is deployed to WSL and SSH hosts.
            if [ "$platform" = universal ]; then
              engines="${!rust_target[*]}"
            elif [ "$platform" = linux-x64 ]; then
              engines=linux-x64
            else
              engines="linux-x64 $platform"
            fi
            targets=""
            for e in $engines; do
              mkdir -p "client/server/$e"
              install -m 755 engines/engine-$e/* "client/server/$e/"
              targets="$targets${targets:+,}${rust_target[$e]}"
            done
            python3 scripts/third_party_notices.py --targets "$targets" \
              --out client/THIRD_PARTY_NOTICES.md --rust-std-copy client/licenses/rust-std-library.html
            if [ "$platform" = universal ]; then
              (cd client && npx vsce package --no-dependencies -o "../dist/dvicode-$version.vsix")
            else
              (cd client && npx vsce package --no-dependencies --target "$platform" -o "../dist/dvicode-$platform-$version.vsix")
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
      - name: GitHub release
        # Only for the tag push: a run started by hand (to publish) finds the release there.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --title "DVICode $GITHUB_REF_NAME" --generate-notes --prerelease

  open-vsx:
    name: Publish to Open VSX
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    # Trusted publishing: Open VSX is registered to trust this workflow file, in this repository,
    # in this environment, and exchanges the job's OIDC ID token for a token that can publish this
    # one extension for a few minutes. No access token is stored.
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      # Only the publishing tool's locked dependency list.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/ovsx
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install ovsx
        # Exactly the versions and hashes of scripts/ovsx/package-lock.json, with no install
        # scripts: nothing else runs in this job, which can publish.
        run: npm ci --ignore-scripts --prefix scripts/ovsx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix
          path: dist
      - name: Publish
        run: |
          set -euo pipefail
          for f in dist/*.vsix; do
            scripts/ovsx/node_modules/.bin/ovsx publish "$f" --trusted-publishing --skip-duplicate
          done
