[package]
name = "dvicode-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dvicode-server"
path = "src/main.rs"

[dependencies]
dvi-syntax.workspace = true
dvi-project.workspace = true
dvi-analysis.workspace = true
smol_str.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
url.workspace = true
log.workspace = true
rayon.workspace = true
base64 = "0.22"

# musl's own allocator serialises the parallel builds (4x slower than glibc on large projects):
# the static x86_64 Linux engine uses mimalloc instead (it needs musl-tools to build; the ARM
# engine, cross-compiled without a C compiler, keeps musl's).
[target.'cfg(all(target_env = "musl", target_arch = "x86_64"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
